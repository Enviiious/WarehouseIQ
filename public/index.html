<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>WarehouseIQ</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef2ff;font:16px system-ui}main{max-width:700px;margin:auto;padding:20px}h1{margin:0;color:#ff6666}p,small{color:#aab6c9}input,textarea,button{font:inherit;border:1px solid #43516a;border-radius:10px;padding:12px;background:#1e293b;color:white;width:100%;margin:5px 0}button{background:#c52f3d;border:0;font-weight:bold;cursor:pointer}nav{display:flex;gap:8px}nav button{background:#334155}article,form{background:#192436;padding:16px;border-radius:12px;margin:10px 0}label{display:block;font-size:14px;color:#bac7db}.line{display:flex;gap:8px}.line>*{flex:1}h2{font-size:20px}article button{background:#334155}article input[type=checkbox]{width:auto;margin-right:12px} [hidden]{display:none!important}</style><main><h1>WarehouseIQ</h1><p>Find it. Log it. Shop faster.</p><label>Warehouse<input id="warehouse" value="Boise" list="stores"><datalist id="stores"><option>Boise</option><option>Meridian</option><option>Nampa</option></datalist></label><nav><button data-tab="search">Search</button><button data-tab="log">Log item</button><button data-tab="batch">Batch</button></nav><p id="status" role="status"></p><section id="search"><input id="query" placeholder="Product name, item number, aisle"><div id="results"></div></section><section id="log" hidden><h2>Record verified location</h2><form id="entry"><label>Product name<input name="name" required></label><label>Item number / barcode<input name="sku"></label><div class="line"><label>Aisle<input name="aisle"></label><label>Section / endcap<input name="section"></label></div><label>Department<input name="department"></label><label>Walking order (lower = earlier)<input name="route_order" type="number" value="999" min="1"></label><label>Notes<textarea name="notes"></textarea></label><button>Save location</button></form></section><section id="batch" hidden><h2>Plan your batch</h2><p>Paste one product per line. Known locations sort by your recorded walking order; unknown items stay at the end.</p><textarea id="list" rows="6" placeholder="Product names"></textarea><button id="plan">Sort shopping list</button><div id="route"></div></section></main><script>
const $=id=>document.getElementById(id);let items=[];const status=s=>$('status').textContent=s;function tab(t){for(const x of ['search','log','batch'])$(x).hidden=x!==t}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));async function load(){try{const r=await fetch('/api/items?warehouse='+encodeURIComponent($('warehouse').value));if(!r.ok)throw Error();items=await r.json();render();status(items.length+' verified items')}catch{status('Could not load items. Try again.')}}function card(i,parent,check=false){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=i.name;if(check){const c=document.createElement('input');c.type='checkbox';c.onchange=()=>a.style.opacity=c.checked?.45:1;a.append(c)}a.append(h);const p=document.createElement('p');p.textContent=[i.aisle&&'Aisle '+i.aisle,i.section,i.department].filter(Boolean).join(' · ')||'Location unknown';a.append(p);if(i.notes){const n=document.createElement('small');n.textContent=i.notes;a.append(n)}if(i.updated_at){const n=document.createElement('p');n.textContent='Verified '+new Date(i.updated_at).toLocaleDateString();a.append(n);const b=document.createElement('button');b.textContent='Update location';b.onclick=()=>{for(const k of ['name','sku','aisle','section','department','route_order','notes'])$('entry').elements[k].value=i[k]??'';tab('log')};a.append(b)}parent.append(a)}function render(){const q=$('query').value.toLowerCase();$('results').replaceChildren();const matches=items.filter(i=>[i.name,i.sku,i.aisle,i.department].join(' ').toLowerCase().includes(q));matches.forEach(i=>card(i,$('results')));if(!matches.length)$('results').textContent='No verified matches yet. Log an item to build your map.'}$('query').oninput=render;$('warehouse').onchange=()=>{localStorage.setItem('warehouse',$('warehouse').value);$('route').replaceChildren();load()};$('warehouse').value=localStorage.getItem('warehouse')||'Boise';$('entry').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.warehouse=$('warehouse').value;try{const r=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error();e.target.reset();await load();tab('search');status('Location saved')}catch{status('Save failed. Please retry.')}};$('plan').onclick=()=>{const rows=$('list').value.split('\n').map(x=>x.trim()).filter(Boolean).map(name=>items.find(i=>i.name.toLowerCase()===name.toLowerCase()||i.sku===name)||{name,route_order:1000000});rows.sort((a,b)=>a.route_order-b.route_order);$('route').replaceChildren();rows.forEach(i=>card(i,$('route'),true))};load();
</script></html>
